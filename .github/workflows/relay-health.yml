name: Relay health

# Once a week, publishes a small test event to every default relay, reads it
# back, and looks for the test events of 1, 4 and 12 weeks ago. The job fails
# (and GitHub emails the repository owner) when fewer than three relays both
# accept and return today's event. Result table: job summary.
# GitHub switches scheduled workflows off after 60 days without repository
# activity; run this workflow by hand once to turn it back on.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-health
  cancel-in-progress: false

jobs:
  check:
    # Only in the original, or where it is asked for: a manual run, or the repository variable
    # HIPPO_RELAY_HEALTH set to true. Other copies skip it, so nobody gets unexpected weekly emails.
    if: github.repository == 'thekozugroup/Hippo' || github.event_name == 'workflow_dispatch' || vars.HIPPO_RELAY_HEALTH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The script appends its table to $GITHUB_STEP_SUMMARY and exits 1 when too few relays are healthy.
      - run: node scripts/relay-health.mjs
