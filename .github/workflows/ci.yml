name: CI

# The quality gate: every push, main included. When a push to main passes, the promote workflow
# moves the stable branch to it, and copies of Hippo with automatic updates follow stable
# (scripts/hosting/README.md). Pull requests from this repository are already covered by the push
# run, so only fork PRs run here.
on:
  push:
    branches: ['**'] # every branch, no tags
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:hosting
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
