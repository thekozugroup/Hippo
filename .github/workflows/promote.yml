name: Promote to stable

# Copies of Hippo with automatic updates follow the stable branch, not main
# (scripts/hosting/README.md). When CI passes for a push to main, this moves stable forward to
# exactly the commit that passed. It only ever fast-forwards: it never moves stable back, never
# force-pushes, and stops if stable is not an ancestor of that commit. Only in the original
# repository. A push made with this workflow's token starts no other workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository == 'thekozugroup/Hippo' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward stable
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          case "$SHA" in *[!0-9a-f]* | '') echo "Unexpected commit id."; exit 1 ;; esac
          git cat-file -e "$SHA^{commit}"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is no longer on main (main was rewritten?). Not promoting."
            exit 1
          fi
          if stable="$(git rev-parse --verify --quiet origin/stable)"; then
            if git merge-base --is-ancestor "$SHA" "$stable"; then
              echo "stable ($stable) already contains $SHA. Nothing to do."
              echo "stable already contains \`$SHA\`; nothing to do." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$stable" "$SHA"; then
              echo "stable ($stable) is not an ancestor of $SHA, so it cannot be fast-forwarded. Not promoting."
              exit 1
            fi
          else
            stable=""
            echo "There is no stable branch yet; creating it."
          fi
          # A plain push: Git itself refuses anything but a fast-forward.
          git push origin "$SHA:refs/heads/stable"
          version="$(git show "$SHA:package.json" | sed -n 's/^  "version": "\([^"]*\)".*/\1/p')"
          {
            echo "## stable moved"
            echo
            echo "- From: \`${stable:-(new branch)}\`"
            echo "- To: \`$SHA\` (version $version)"
          } >> "$GITHUB_STEP_SUMMARY"
