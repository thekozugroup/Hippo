name: Deploy to GitHub Pages

# For copies hosted on GitHub Pages (README, "Alternative: GitHub Pages"). It runs only when the
# repository variable HIPPO_PAGES is set to true (Settings, Secrets and variables, Actions,
# Variables), so repositories that do not use Pages, the original included, get no failed runs.
# It also runs after the Update Hippo workflow (scripts/hosting/hippo-update.yml) has committed an
# update, because a commit pushed by a workflow's own token starts no push-triggered workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update Hippo]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # After Update Hippo: only when it succeeded and main has moved since it started (it committed).
    if: >-
      vars.HIPPO_PAGES == 'true' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != github.sha))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run test:e2e
        env:
          HIPPO_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
